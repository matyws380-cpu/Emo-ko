<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#020907">
<title>PUZZLE CAM</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
:root{
 --green:#00ff91;
 --green2:#00c875;
 --gold:#ffd700;
 --black:#020907;
 --panel:rgba(0,20,12,.82);
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

html,body{
 width:100%;
 height:100%;
 overflow:hidden;
 background:#020907;
 color:white;
 font-family:system-ui,sans-serif;
 touch-action:none;
}

#video{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
 object-fit:cover;
 transform:scaleX(-1);
 background:#000;
}

#fx{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
 z-index:5;
 pointer-events:none;
}

#scanlines{
 position:fixed;
 inset:0;
 z-index:6;
 pointer-events:none;
 opacity:.22;
 background:repeating-linear-gradient(
  0deg,
  transparent 0px,
  transparent 3px,
  #00ff9130 4px,
  transparent 5px
 );
}

#vignette{
 position:fixed;
 inset:0;
 z-index:7;
 pointer-events:none;
 background:radial-gradient(
  ellipse at center,
  transparent 30%,
  #001c10aa 100%
 );
}

#grid{
 position:fixed;
 inset:0;
 z-index:8;
 pointer-events:none;
 opacity:0;
 transition:.5s;
 background-image:
  linear-gradient(#00ff9110 1px,transparent 1px),
  linear-gradient(90deg,#00ff9110 1px,transparent 1px);
 background-size:38px 38px;
}

#grid.active{
 opacity:1;
}

#header{
 position:fixed;
 top:15px;
 left:14px;
 right:14px;
 z-index:30;
 display:flex;
 justify-content:space-between;
 align-items:center;
 direction:ltr;
}

.hud{
 padding:9px 13px;
 border:1px solid #00ff9177;
 background:#001b12bb;
 color:var(--green);
 font-size:11px;
 font-weight:900;
 letter-spacing:1px;
 border-radius:5px;
 backdrop-filter:blur(8px);
 box-shadow:0 0 15px #00ff9133;
 text-shadow:0 0 8px #00ff91;
}

#faceStatus{
 position:fixed;
 top:72px;
 left:50%;
 transform:translateX(-50%);
 z-index:30;
 color:var(--green);
 font-size:11px;
 letter-spacing:2px;
 font-weight:900;
 text-shadow:0 0 12px var(--green);
 white-space:nowrap;
}

#faceStatus.detected{
 animation:blink 1s infinite;
}

@keyframes blink{
 50%{opacity:.45}
}

#systemInfo{
 position:fixed;
 bottom:145px;
 left:12px;
 z-index:25;
 display:flex;
 flex-direction:column;
 gap:6px;
 direction:ltr;
 font:10px monospace;
 color:#00ff91;
 text-shadow:0 0 8px #00ff91;
 pointer-events:none;
}

.infoLine{
 background:#001b12a8;
 padding:5px 8px;
 border-left:2px solid #00ff91;
 width:max-content;
 max-width:85vw;
}

#board{
 position:fixed;
 left:50%;
 top:46%;
 transform:translate(-50%,-50%);
 width:min(78vw,390px,52vh);
 aspect-ratio:1;
 border:2px solid var(--gold);
 box-shadow:0 0 25px #ffd70066;
 z-index:12;
 display:none;
 pointer-events:none;
}

#board.visible{
 display:block;
}

#board.done{
 border-color:var(--green);
 box-shadow:0 0 30px #00ff9188;
}

#pieces{
 position:fixed;
 inset:0;
 z-index:15;
 pointer-events:none;
}

.piece{
 position:absolute;
 background-repeat:no-repeat;
 border:1px solid #ffffffaa;
 box-shadow:0 4px 15px #0009;
 pointer-events:auto;
 touch-action:none;
 user-select:none;
 -webkit-user-select:none;
}

.piece.drag{
 z-index:100!important;
 border:2px solid var(--gold);
 box-shadow:0 0 22px #ffd700aa;
 transform:scale(1.04);
}

.piece.correct{
 border:2px solid var(--green);
 box-shadow:0 0 12px #00ff9188;
}

#handDot{
 position:fixed;
 width:20px;
 height:20px;
 border:2px solid white;
 border-radius:50%;
 background:var(--green);
 box-shadow:0 0 18px var(--green);
 transform:translate(-50%,-50%);
 pointer-events:none;
 display:none;
 z-index:110;
}

#handDot.pinching{
 width:30px;
 height:30px;
 background:var(--gold);
 box-shadow:0 0 20px var(--gold);
}

#message{
 position:fixed;
 bottom:95px;
 left:50%;
 transform:translateX(-50%);
 padding:11px 16px;
 background:#001b12ee;
 border:1px solid #00ff9166;
 color:var(--green);
 font-size:12px;
 font-weight:900;
 text-align:center;
 border-radius:5px;
 z-index:35;
 max-width:94vw;
 white-space:nowrap;
 box-shadow:0 0 15px #00ff9122;
}

#count{
 position:fixed;
 inset:0;
 display:none;
 place-items:center;
 font-size:120px;
 font-weight:1000;
 color:var(--green);
 text-shadow:0 0 30px var(--green);
 z-index:150;
}

#controls{
 position:fixed;
 bottom:max(15px,env(safe-area-inset-bottom));
 left:0;
 right:0;
 display:flex;
 justify-content:center;
 gap:9px;
 flex-wrap:wrap;
 padding:0 8px;
 z-index:130;
}

button{
 border:1px solid #00ff9188;
 background:#001c12ee;
 color:var(--green);
 padding:12px 17px;
 border-radius:5px;
 font-size:12px;
 font-weight:900;
 box-shadow:0 0 12px #00ff9122;
}

button.primary{
 background:#00c875;
 color:#00150d;
 border-color:var(--green);
}

button:disabled{
 opacity:.35;
}

#toast{
 position:fixed;
 top:20%;
 left:50%;
 transform:translate(-50%,-10px);
 background:#001b12;
 border:1px solid var(--green);
 color:var(--green);
 padding:12px 18px;
 z-index:200;
 opacity:0;
 transition:.25s;
 font-weight:900;
 border-radius:5px;
 text-align:center;
 max-width:90vw;
}

#toast.show{
 opacity:1;
 transform:translate(-50%,0);
}

#loading{
 position:fixed;
 inset:0;
 z-index:300;
 background:#020907;
 display:flex;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 gap:15px;
}

#loading.hide{
 display:none;
}

.loader{
 width:45px;
 height:45px;
 border:3px solid #16412c;
 border-top-color:var(--green);
 border-radius:50%;
 animation:spin .8s linear infinite;
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

#loadText{
 color:var(--green);
 font-size:12px;
 letter-spacing:2px;
 font-weight:900;
 text-align:center;
 padding:0 20px;
}

#loadError{
 color:#ff7b8e;
 font-size:12px;
 max-width:90%;
 text-align:center;
 line-height:1.8;
}

#success{
 position:fixed;
 inset:0;
 z-index:190;
 display:none;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 gap:15px;
 background:#001309e8;
 text-align:center;
}

#success.show{
 display:flex;
}

#success h1{
 color:var(--green);
 font-size:30px;
 text-shadow:0 0 20px var(--green);
}

#success p{
 color:#d4ffe4;
 font-size:13px;
}

@media(max-height:620px){
 #board{
  top:43%;
  width:min(65vw,46vh);
 }
 #message{bottom:80px}
 button{padding:9px 13px}
 #systemInfo{bottom:125px}
}
</style>
</head>

<body>

<video id="video" autoplay muted playsinline></video>
<canvas id="fx"></canvas>

<div id="scanlines"></div>
<div id="vignette"></div>
<div id="grid"></div>

<div id="loading">
 <div class="loader"></div>
 <div id="loadText">INITIALIZING PUZZLE CAM...</div>
 <div id="loadError"></div>
</div>

<div id="header">
 <div class="hud">PUZZLE CAM</div>
 <div class="hud" id="progress">0 / 9</div>
</div>

<div id="faceStatus">SCANNING FACE...</div>

<div id="systemInfo">
 <div class="infoLine" id="sys1">SYSTEM: INITIALIZING</div>
 <div class="infoLine" id="sys2">FACE: SEARCHING</div>
 <div class="infoLine" id="sys3">HAND: STANDBY</div>
 <div class="infoLine" id="sys4">SECURITY: ACTIVE</div>
</div>

<div id="board"></div>
<div id="pieces"></div>
<div id="handDot"></div>

<div id="message">
 جاري تشغيل الكاميرا واكتشاف الوجه
</div>

<div id="count">3</div>
<div id="toast"></div>

<div id="success">
 <h1>PUZZLE SOLVED</h1>
 <p>تم تجميع الوجه بنجاح</p>
 <button onclick="resetGame()">PLAY AGAIN</button>
</div>

<div id="controls">
 <button class="primary" id="start">📸 CAPTURE</button>
 <button id="save" disabled>⬇ SAVE</button>
 <button id="reset">↻ RESET</button>
</div>

<script>
"use strict";

/* ==========================================
   PUZZLE CAM - MAIN ELEMENTS
========================================== */

const $ = id => document.getElementById(id);

const video = $("video");
const fx = $("fx");
const ctx = fx.getContext("2d");

const board = $("board");
const piecesLayer = $("pieces");
const dot = $("handDot");
const message = $("message");
const faceStatus = $("faceStatus");
const progress = $("progress");
const loading = $("loading");
const countEl = $("count");
const saveBtn = $("save");

const GRID = 3;
const TOTAL = GRID * GRID;

/* ==========================================
   APP STATE
========================================== */

let stream = null;

let faceDetector = null;
let handDetector = null;

let faceBox = null;
let lastFaceTime = 0;

let ready = false;
let photo = null;

let pieces = [];
let solved = false;
let counting = false;

let processing = false;
let lastFrame = 0;

let pinch = false;
let dragged = null;

let offset = {x:0,y:0};

let pointerId = null;
let handControl = true;

let animationId = null;
let toastTimer = null;

let faceScanTimer = null;

/* ==========================================
   SMALL HELPERS
========================================== */

function say(text){
 message.textContent = text;
}

function toast(text){
 const el = $("toast");

 el.textContent = text;
 el.classList.add("show");

 clearTimeout(toastTimer);

 toastTimer = setTimeout(()=>{
  el.classList.remove("show");
 },2200);
}

function setLoadText(text){
 $("loadText").textContent = text;
}

function setLoadError(text){
 $("loadError").textContent = text;
}

function resizeCanvas(){
 const dpr = Math.min(window.devicePixelRatio || 1,2);

 fx.width = Math.floor(innerWidth*dpr);
 fx.height = Math.floor(innerHeight*dpr);

 fx.style.width = innerWidth+"px";
 fx.style.height = innerHeight+"px";

 ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resizeCanvas);
resizeCanvas();

/* ==========================================
   HACKER HUD EFFECTS
========================================== */

function drawFaceHUD(){

 ctx.clearRect(0,0,innerWidth,innerHeight);

 if(!faceBox || Date.now()-lastFaceTime>1200){

  faceStatus.textContent = "SCANNING FACE...";
  faceStatus.classList.remove("detected");

  $("sys2").textContent = "FACE: SEARCHING";

  return;
 }

 const W = innerWidth;
 const H = innerHeight;

 const x = (1-faceBox.centerX-faceBox.width/2)*W;
 const y = (faceBox.centerY-faceBox.height/2)*H;
 const w = faceBox.width*W;
 const h = faceBox.height*H;

 const color = "#00ff91";

 ctx.save();

 ctx.strokeStyle = color;
 ctx.fillStyle = color;

 ctx.lineWidth = 2;

 ctx.shadowColor = color;
 ctx.shadowBlur = 14;

 const corner = Math.min(w,h)*.19;

 // Face tracking corners
 ctx.beginPath();

 ctx.moveTo(x,y+corner);
 ctx.lineTo(x,y);
 ctx.lineTo(x+corner,y);

 ctx.moveTo(x+w-corner,y);
 ctx.lineTo(x+w,y);
 ctx.lineTo(x+w,y+corner);

 ctx.moveTo(x,y+h-corner);
 ctx.lineTo(x,y+h);
 ctx.lineTo(x+corner,y+h);

 ctx.moveTo(x+w-corner,y+h);
 ctx.lineTo(x+w,y+h);
 ctx.lineTo(x+w,y+h-corner);

 ctx.stroke();

 // Face center cross
 ctx.globalAlpha=.55;
 ctx.lineWidth=1;

 ctx.beginPath();

 ctx.moveTo(x+w/2-12,y+h/2);
 ctx.lineTo(x+w/2+12,y+h/2);

 ctx.moveTo(x+w/2,y+h/2-12);
 ctx.lineTo(x+w/2,y+h/2+12);

 ctx.stroke();

 // Horizontal scanner line
 const scanY = y + ((Date.now()%1800)/1800)*h;

 ctx.globalAlpha=.8;
 ctx.lineWidth=1.5;

 ctx.beginPath();
 ctx.moveTo(x,scanY);
 ctx.lineTo(x+w,scanY);
 ctx.stroke();

 // Face label
 ctx.globalAlpha=1;
 ctx.font="bold 11px monospace";
 ctx.fillText("FACE DETECTED",x,y-12);

 ctx.font="9px monospace";
 ctx.fillText("TRACKING: ACTIVE",x,y+h+15);

 // Tracking points
 for(let i=0;i<4;i++){

  const px = x+(i%2)*w;
  const py = y+Math.floor(i/2)*h;

  ctx.beginPath();
  ctx.arc(px,py,3,0,Math.PI*2);
  ctx.fill();
 }

 ctx.restore();

 faceStatus.textContent = "● FACE DETECTED";
 faceStatus.classList.add("detected");

 $("sys2").textContent = "FACE: LOCKED";
}

function drawGridHUD(){

 const W = innerWidth;
 const H = innerHeight;

 ctx.save();

 ctx.strokeStyle = "rgba(0,255,145,.09)";
 ctx.lineWidth = 1;

 for(let x=0;x<W;x+=42){

  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,H);
  ctx.stroke();
 }

 for(let y=0;y<H;y+=42){

  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(W,y);
  ctx.stroke();
 }

 // Moving scan band
 const scanY = (Date.now()*.09)%H;

 const gradient = ctx.createLinearGradient(
  0,scanY-30,0,scanY+30
 );

 gradient.addColorStop(0,"rgba(0,255,145,0)");
 gradient.addColorStop(.5,"rgba(0,255,145,.18)");
 gradient.addColorStop(1,"rgba(0,255,145,0)");

 ctx.fillStyle=gradient;
 ctx.fillRect(0,scanY-30,W,60);

 ctx.restore();
}

function drawHUD(){

 if(!ready || photo) return;

 ctx.clearRect(0,0,innerWidth,innerHeight);

 drawGridHUD();
 drawFaceHUD();
}

function renderLoop(){

 drawHUD();

 animationId = requestAnimationFrame(renderLoop);
}

/* ==========================================
   FACE DETECTION
========================================== */

function onFaceResults(results){

 const detection = results.detections?.[0];

 if(!detection){

  faceBox = null;

  if(!photo){
   faceStatus.textContent = "SCANNING FACE...";
  }

  $("sys2").textContent = "FACE: SEARCHING";

  return;
 }

 const b = detection.boundingBox;

 faceBox = {
  centerX:b.xCenter,
  centerY:b.yCenter,
  width:b.width,
  height:b.height
 };

 lastFaceTime = Date.now();

 $("sys1").textContent = "SYSTEM: ONLINE";
 $("sys4").textContent = "SECURITY: ACTIVE";

}

/* ==========================================
   CAPTURE PHOTO
========================================== */

function capturePhoto(){

 if(!video.videoWidth || !video.videoHeight){
  throw new Error("الكاميرا غير جاهزة");
 }

 const W = video.videoWidth;
 const H = video.videoHeight;

 const c = document.createElement("canvas");

 c.width = 600;
 c.height = 600;

 const g = c.getContext("2d",{
  willReadFrequently:true
 });

 let sx,sy,size;

 if(faceBox){

  const cx = (1-faceBox.centerX)*W;
  const cy = faceBox.centerY*H;

  size = Math.max(
   faceBox.width*W,
   faceBox.height*H
  )*1.65;

  size = Math.min(size,W,H);

  sx = Math.max(0,Math.min(W-size,cx-size/2));
  sy = Math.max(0,Math.min(H-size,cy-size/2));

 }else{

  size = Math.min(W,H)*.85;

  sx = (W-size)/2;
  sy = (H-size)/2;
 }

 // Mirror selfie image
 g.save();

 g.translate(600,0);
 g.scale(-1,1);

 g.drawImage(
  video,
  sx,sy,size,size,
  0,0,600,600
 );

 g.restore();

 // Convert to grayscale
 const img = g.getImageData(0,0,600,600);
 const d = img.data;

 for(let i=0;i<d.length;i+=4){

  const gray =
   .299*d[i]+
   .587*d[i+1]+
   .114*d[i+2];

  d[i]=gray;
  d[i+1]=gray;
  d[i+2]=gray;
 }

 g.putImageData(img,0,0);

 return c.toDataURL("image/jpeg",.92);
}

/* ==========================================
   COUNTDOWN
========================================== */

function startCapture(){

 if(!ready){
  toast("الكاميرا لم تعمل بعد");
  return;
 }

 if(counting) return;

 if(!faceBox || Date.now()-lastFaceTime>1200){
  toast("خلي وجهك ظاهر أمام الكاميرا");
  return;
 }

 counting = true;

 let n=3;

 countEl.style.display="grid";
 countEl.textContent=n;

 say("جاري تثبيت الوجه والتقاط الصورة");

 const timer = setInterval(()=>{

  n--;

  if(n>0){

   countEl.textContent=n;

  }else{

   clearInterval(timer);

   countEl.style.display="none";
   counting=false;

   try{

    photo=capturePhoto();

    faceBox=null;

    $("grid").classList.remove("active");

    board.classList.add("visible");

    buildPuzzle();

    say("اسحب القطع إلى أماكنها الصحيحة");

    faceStatus.textContent="PUZZLE MODE";

    $("sys2").textContent="FACE: CAPTURED";

   }catch(e){

    toast(e.message);
    say(e.message);
   }
  }

 },850);
}

/* ==========================================
   PUZZLE DIMENSIONS
========================================== */

function dimensions(){

 const r=board.getBoundingClientRect();

 return {
  rect:r,
  pw:r.width/GRID,
  ph:r.height/GRID
 };
}

/* ==========================================
   CREATE PUZZLE
========================================== */

function buildPuzzle(){

 if(!photo){
  toast("لم يتم التقاط صورة الوجه");
  return;
 }

 piecesLayer.innerHTML="";
 pieces=[];

 solved=false;

 board.classList.remove("done");

 saveBtn.disabled=true;

 const d=dimensions();

 let order=Array.from(
  {length:TOTAL},
  (_,i)=>i
 );

 // Shuffle puzzle
 do{

  for(let i=order.length-1;i>0;i--){

   const j=Math.floor(Math.random()*(i+1));

   [order[i],order[j]]=[order[j],order[i]];
  }

 }while(order.every((v,i)=>v===i));

 order.forEach((correct,slot)=>{

  const col=slot%GRID;
  const row=Math.floor(slot/GRID);

  const el=document.createElement("div");

  el.className="piece";

  el.style.width=d.pw+"px";
  el.style.height=d.ph+"px";

  const x=d.rect.left+col*d.pw;
  const y=d.rect.top+row*d.ph;

  el.style.left=x+"px";
  el.style.top=y+"px";

  el.style.backgroundImage=`url("${photo}")`;

  el.style.backgroundSize=
   `${d.rect.width}px ${d.rect.height}px`;

  const cc=correct%GRID;
  const cr=Math.floor(correct/GRID);

  el.style.backgroundPosition=
   `${-cc*d.pw}px ${-cr*d.ph}px`;

  const p={
   el,
   correct,
   x,
   y,
   w:d.pw,
   h:d.ph
  };

  el.addEventListener(
   "pointerdown",
   e=>pointerStart(e,p)
  );

  piecesLayer.appendChild(el);

  pieces.push(p);
 });

 updateProgress();

 $("sys3").textContent="HAND: READY";

 // Start hand tracking after capture
 toast("تم إنشاء البازل! ابدأ بتحريك القطع");
}

/* ==========================================
   TARGET POSITION
========================================== */

function target(p){

 const d=dimensions();

 return {
  x:d.rect.left+(p.correct%GRID)*d.pw,
  y:d.rect.top+Math.floor(p.correct/GRID)*d.ph
 };
}

function near(a,b,t){

 return Math.abs(a.x-b.x)<t &&
        Math.abs(a.y-b.y)<t;
}

function place(p,x,y){

 p.x=x;
 p.y=y;

 p.el.style.left=x+"px";
 p.el.style.top=y+"px";
}

function snap(p){

 const t=target(p);

 if(near(p,t,Math.min(32,p.w*.25))){

  place(p,t.x,t.y);

  p.el.classList.add("correct");

  return true;
 }

 p.el.classList.remove("correct");

 return false;
}

/* ==========================================
   DRAG PIECES
========================================== */

function beginDrag(p,x,y){

 if(!p || dragged) return;

 if(p.el.classList.contains("correct")) return;

 dragged=p;

 const r=p.el.getBoundingClientRect();

 offset={
  x:x-r.left,
  y:y-r.top
 };

 p.el.classList.add("drag");
}

function moveDrag(x,y){

 if(!dragged) return;

 place(
  dragged,
  x-offset.x,
  y-offset.y
 );
}

function endDrag(){

 if(!dragged) return;

 const p=dragged;

 p.el.classList.remove("drag");

 snap(p);

 dragged=null;

 updateProgress();
}

function findPiece(x,y){

 for(let i=pieces.length-1;i>=0;i--){

  const p=pieces[i];

  if(p.el.classList.contains("correct")) continue;

  const r=p.el.getBoundingClientRect();

  if(
   x>=r.left && x<=r.right &&
   y>=r.top && y<=r.bottom
  ){
   return p;
  }
 }

 return null;
}

/* ==========================================
   TOUCH AND MOUSE
========================================== */

function pointerStart(e,p){

 if(!photo || dragged || pointerId!==null) return;

 if(p.el.classList.contains("correct")) return;

 e.preventDefault();

 pointerId=e.pointerId;

 handControl=false;

 beginDrag(p,e.clientX,e.clientY);

 try{
  p.el.setPointerCapture(e.pointerId);
 }catch(err){}
}

window.addEventListener("pointermove",e=>{

 if(pointerId!==e.pointerId) return;

 moveDrag(e.clientX,e.clientY);

});

function pointerFinish(e){

 if(pointerId!==e.pointerId) return;

 pointerId=null;

 endDrag();

 handControl=true;
}

window.addEventListener("pointerup",pointerFinish);
window.addEventListener("pointercancel",pointerFinish);

/* ==========================================
   HAND TRACKING
========================================== */

function onHandResults(results){

 const lm=results.multiHandLandmarks?.[0];

 if(!lm){

  dot.style.display="none";

  if(pinch && dragged && handControl){
   endDrag();
  }

  pinch=false;

  $("sys3").textContent="HAND: SEARCHING";

  return;
 }

 const thumb=lm[4];
 const index=lm[8];

 const dist=Math.hypot(
  thumb.x-index.x,
  thumb.y-index.y
 );

 const isPinch=dist<.052;

 const x=(1-(thumb.x+index.x)/2)*innerWidth;
 const y=((thumb.y+index.y)/2)*innerHeight;

 dot.style.display="block";
 dot.style.left=x+"px";
 dot.style.top=y+"px";

 dot.classList.toggle("pinching",isPinch);

 $("sys3").textContent=isPinch
  ?"HAND: PINCH ACTIVE"
  :"HAND: TRACKED";

 if(!photo || !handControl){
  pinch=isPinch;
  return;
 }

 if(isPinch && !pinch && !dragged){

  const p=findPiece(x,y);

  if(p){
   beginDrag(p,x,y);
  }
 }

 if(isPinch && dragged){
  moveDrag(x,y);
 }

 if(!isPinch && pinch && dragged){
  endDrag();
 }

 pinch=isPinch;
}

/* ==========================================
   PROGRESS AND WIN
========================================== */

function updateProgress(){

 const n=pieces.filter(
  p=>p.el.classList.contains("correct")
 ).length;

 progress.textContent=`${n} / ${TOTAL}`;

 if(n===TOTAL && !solved){

  solved=true;

  board.classList.add("done");

  say("اكتملت الصورة بنجاح!");

  saveBtn.disabled=false;

  $("success").classList.add("show");

  celebrate();
 }
}

/* ==========================================
   CELEBRATION
========================================== */

function celebrate(){

 const colors=[
  "#00ff91",
  "#ffd700",
  "#00d9ff",
  "#ffffff"
 ];

 for(let i=0;i<75;i++){

  const el=document.createElement("div");

  el.style.position="fixed";
  el.style.width="8px";
  el.style.height="8px";
  el.style.left="50%";
  el.style.top="45%";
  el.style.background=colors[i%colors.length];
  el.style.zIndex="180";
  el.style.pointerEvents="none";

  document.body.appendChild(el);

  const a=Math.random()*Math.PI*2;
  const d=100+Math.random()*250;

  const anim=el.animate([

   {transform:"translate(0,0)",opacity:1},

   {
    transform:`translate(
     ${Math.cos(a)*d}px,
     ${Math.sin(a)*d+160}px
    ) rotate(720deg)`,
    opacity:0
   }

  ],{
   duration:1300+Math.random()*600,
   easing:"ease-out"
  });

  anim.onfinish=()=>el.remove();
 }

 if(navigator.vibrate){
  navigator.vibrate([100,50,100]);
 }
}

/* ==========================================
   SAVE PHOTO
========================================== */

function saveImage(){

 if(!solved || !photo){
  toast("أكملي البازل أولاً");
  return;
 }

 const a=document.createElement("a");

 a.href=photo;
 a.download="PUZZLE-CAM.jpg";

 document.body.appendChild(a);
 a.click();
 a.remove();

 toast("تم تجهيز الصورة للحفظ");
}

/* ==========================================
   RESET GAME
========================================== */

function resetGame(){

 if(dragged){
  dragged.el.classList.remove("drag");
  dragged=null;
 }

 photo=null;
 pieces=[];
 solved=false;
 pinch=false;

 piecesLayer.innerHTML="";

 board.classList.remove("visible","done");

 $("success").classList.remove("show");

 $("grid").classList.add("active");

 saveBtn.disabled=true;

 progress.textContent="0 / 9";

 faceStatus.textContent="SCANNING FACE...";

 $("sys2").textContent="FACE: SEARCHING";
 $("sys3").textContent="HAND: STANDBY";

 say("انظري إلى الكاميرا لاكتشاف الوجه");
}

/* ==========================================
   FACE AND HAND MODELS
========================================== */

async function initializeModels(){

 if(typeof FaceDetection==="undefined"){
  throw new Error("مكتبة اكتشاف الوجه لم يتم تحميلها. افحصي الإنترنت.");
 }

 if(typeof Hands==="undefined"){
  throw new Error("مكتبة تتبع اليد لم يتم تحميلها. افحصي الإنترنت.");
 }

 faceDetector=new FaceDetection({
  locateFile:file=>
   `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
 });

 faceDetector.setOptions({
  model:"short",
  minDetectionConfidence:.55
 });

 faceDetector.onResults(onFaceResults);

 handDetector=new Hands({
  locateFile:file=>
   `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
 });

 handDetector.setOptions({
  maxNumHands:1,
  modelComplexity:0,
  minDetectionConfidence:.6,
  minTrackingConfidence:.55
 });

 handDetector.onResults(onHandResults);
}

/* ==========================================
   CAMERA INITIALIZATION
========================================== */

async function initializeCamera(){

 try{

  setLoadText("LOADING AI SYSTEM...");
  setLoadError("");

  if(!navigator.mediaDevices?.getUserMedia){
   throw new Error("الكاميرا تحتاج HTTPS أو localhost.");
  }

  // Load models
  await initializeModels();

  setLoadText("REQUESTING CAMERA PERMISSION...");

  // Camera starts automatically on page load.
  stream=await navigator.mediaDevices.getUserMedia({

   audio:false,

   video:{
    facingMode:"user",
    width:{ideal:640},
    height:{ideal:480},
    frameRate:{ideal:24,max:30}
   }

  });

  video.srcObject=stream;

  await new Promise((resolve,reject)=>{

   if(video.readyState>=2){
    resolve();
    return;
   }

   const timeout=setTimeout(()=>{
    reject(new Error("انتهى وقت انتظار الكاميرا."));
   },12000);

   video.onloadedmetadata=()=>{
    clearTimeout(timeout);
    resolve();
   };

   video.onerror=()=>{
    clearTimeout(timeout);
    reject(new Error("تعذر قراءة فيديو الكاميرا."));
   };

  });

  await video.play();

  ready=true;

  loading.classList.add("hide");

  $("grid").classList.add("active");

  say("انظري إلى الكاميرا لاكتشاف الوجه");

  $("sys1").textContent="SYSTEM: ONLINE";

  $("sys4").textContent="SECURITY: ACTIVE";

  renderLoop();

  processLoop();

 }catch(e){

  console.error(e);

  loading.classList.remove("hide");

  setLoadText("CAMERA / AI ERROR");

  setLoadError(
   e.message+
   "\n\nاسمحي للكاميرا من إعدادات Chrome وافتحي الصفحة عبر localhost أو HTTPS."
  );

  say("تحققي من إذن الكاميرا والإنترنت");

  $("sys1").textContent="SYSTEM: ERROR";
 }
}

/* ==========================================
   FRAME PROCESSING
========================================== */

async function processLoop(){

 if(!ready) return;

 const now=performance.now();

 if(
  !processing &&
  video.readyState>=2 &&
  now-lastFrame>110
 ){

  processing=true;
  lastFrame=now;

  try{

   // Face detection
   await faceDetector.send({
    image:video
   });

   // Hand detection runs only during puzzle mode.
   if(photo){

    await handDetector.send({
     image:video
    });

   }else{

    dot.style.display="none";
   }

  }catch(e){

   console.warn("AI PROCESSING:",e);

  }finally{

   processing=false;
  }
 }

 setTimeout(processLoop,25);
}

/* ==========================================
   BUTTON EVENTS
========================================== */

$("start").addEventListener(
 "click",
 startCapture
);

$("save").addEventListener(
 "click",
 saveImage
);

$("reset").addEventListener(
 "click",
 resetGame
);

/* ==========================================
   PAGE CLEANUP
========================================== */

window.addEventListener("pagehide",()=>{

 ready=false;

 if(animationId){
  cancelAnimationFrame(animationId);
 }

 if(stream){

  stream.getTracks().forEach(
   track=>track.stop()
  );
 }

 try{

  faceDetector?.close();
  handDetector?.close();

 }catch(e){}
});

/* ==========================================
   START APP AUTOMATICALLY
========================================== */

// No camera start button is needed.
// Chrome will request permission when the page opens.
initializeCamera();

</script>
