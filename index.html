
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PUZZLE CAM - EMAN</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, sans-serif;
}

:root {
  --gold: #ffd700;
  --green: #00ff99;
  --glass: rgba(0,0,0,.72);
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: white;
  touch-action: none;
}

#video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
  filter: brightness(.85);
}

#shade {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    rgba(0,0,0,.5),
    transparent 30%,
    transparent 70%,
    rgba(0,0,0,.6)
  );
}

#top {
  position: fixed;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  z-index: 30;
  direction: ltr;
}

.pill {
  background: var(--glass);
  border: 1px solid #ffffff30;
  padding: 9px 13px;
  border-radius: 25px;
  font-size: 12px;
  font-weight: 900;
  backdrop-filter: blur(10px);
}

#brand {
  color: var(--gold);
  letter-spacing: 1px;
}

#progress {
  color: white;
}

#board {
  position: absolute;
  width: min(78vw, 390px, 52vh);
  height: min(78vw, 390px, 52vh);
  left: 50%;
  top: 47%;
  transform: translate(-50%, -50%);
  border: 3px solid var(--gold);
  box-shadow: 0 0 25px #ffd70066;
  z-index: 5;
  pointer-events: none;
  transition: .3s;
}

#board::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg,
      transparent 33%,
      #ffffff55 33.3%,
      transparent 33.6%,
      transparent 66.4%,
      #ffffff55 66.7%,
      transparent 67%
    ),
    linear-gradient(0deg,
      transparent 33%,
      #ffffff55 33.3%,
      transparent 33.6%,
      transparent 66.4%,
      #ffffff55 66.7%,
      transparent 67%
    );
}

#board.done {
  border-color: var(--green);
  box-shadow: 0 0 35px #00ff9988;
}

#pieces {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
}

.piece {
  position: absolute;
  background-repeat: no-repeat;
  border: 1px solid #ffffffaa;
  box-shadow: 0 5px 15px #0009;
  pointer-events: auto;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.piece.drag {
  z-index: 100 !important;
  border: 3px solid var(--gold);
  box-shadow: 0 0 22px #ffd700aa;
  transform: scale(1.04);
}

.piece.correct {
  border: 2px solid var(--green);
  box-shadow: 0 0 13px #00ff9988;
}

#handDot {
  position: fixed;
  width: 20px;
  height: 20px;
  border: 3px solid white;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 18px var(--gold);
  z-index: 110;
  pointer-events: none;
  transform: translate(-50%, -50%);
  display: none;
}

#handDot.pinching {
  width: 30px;
  height: 30px;
  background: var(--green);
  box-shadow: 0 0 20px var(--green);
}

#message {
  position: fixed;
  left: 50%;
  top: calc(47% + min(39vw,195px,26vh) + 15px);
  transform: translateX(-50%);
  background: var(--glass);
  border: 1px solid #ffffff30;
  border-radius: 20px;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 900;
  text-align: center;
  white-space: nowrap;
  z-index: 30;
  max-width: 94vw;
}

#count {
  position: fixed;
  inset: 0;
  display: none;
  place-items: center;
  font-size: 120px;
  font-weight: 1000;
  color: var(--gold);
  text-shadow: 0 0 30px black, 0 0 30px var(--gold);
  z-index: 150;
}

#status {
  position: fixed;
  bottom: 78px;
  left: 50%;
  transform: translateX(-50%);
  background: #0009;
  padding: 7px 12px;
  border-radius: 20px;
  font-size: 11px;
  z-index: 30;
  white-space: nowrap;
}

#controls {
  position: fixed;
  bottom: max(12px, env(safe-area-inset-bottom));
  left: 10px;
  right: 10px;
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  z-index: 120;
}

button {
  border: none;
  border-radius: 25px;
  padding: 12px 17px;
  font-weight: 900;
  font-size: 13px;
  color: #111;
  background: white;
  box-shadow: 0 5px 15px #0007;
}

button.primary {
  background: var(--gold);
}

button:disabled {
  opacity: .4;
}

#toast {
  position: fixed;
  top: 18%;
  left: 50%;
  transform: translate(-50%, -10px);
  padding: 12px 18px;
  border: 1px solid var(--green);
  background: #071b14;
  color: var(--green);
  border-radius: 15px;
  font-weight: 900;
  opacity: 0;
  transition: .25s;
  z-index: 200;
  pointer-events: none;
}

#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

.confetti {
  position: fixed;
  width: 9px;
  height: 9px;
  z-index: 180;
  pointer-events: none;
  border-radius: 2px;
}

@media(max-height:620px) {
  #board {
    top: 43%;
    width: min(65vw, 46vh);
    height: min(65vw, 46vh);
  }

  #message {
    top: calc(43% + min(32.5vw,23vh) + 10px);
  }

  #status {
    bottom: 65px;
  }

  button {
    padding: 9px 13px;
  }
}
</style>
</head>

<body>

<video id="video" autoplay muted playsinline></video>
<div id="shade"></div>

<div id="top">
  <div class="pill" id="brand">PUZZLE CAM · EMAN</div>
  <div class="pill" id="progress">0 / 9</div>
</div>

<div id="board"></div>
<div id="pieces"></div>
<div id="handDot"></div>

<div id="message">
  اضغطي ابدأ وارفعي يدك أمام الكاميرا ✋
</div>

<div id="count">3</div>
<div id="status">جارٍ تجهيز الكاميرا...</div>
<div id="toast"></div>

<div id="controls">
  <button class="primary" id="start">📸 ابدأ التصوير</button>
  <button id="save" disabled>⬇ حفظ الصورة</button>
  <button id="reset">↻ إعادة</button>
</div>

<script>
"use strict";

/* =========================
   ELEMENTS
========================= */

const $ = id => document.getElementById(id);

const video = $("video");
const board = $("board");
const piecesLayer = $("pieces");
const dot = $("handDot");
const message = $("message");
const progress = $("progress");
const status = $("status");
const countEl = $("count");
const startBtn = $("start");
const saveBtn = $("save");

const GRID = 3;
const TOTAL = GRID * GRID;

/* =========================
   STATE
========================= */

let hands = null;
let stream = null;

let photo = null;
let pieces = [];

let ready = false;
let solved = false;
let countdownRunning = false;

let pinching = false;
let dragged = null;

let dragOffset = {x:0,y:0};

let pointerDragId = null;
let handEnabled = true;

let lastSend = 0;
let processing = false;
let rafId = null;
let toastTimer = null;

/* =========================
   HELPERS
========================= */

function say(text) {
  message.textContent = text;
}

function toast(text) {
  const el = $("toast");

  el.textContent = text;
  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    el.classList.remove("show");
  }, 2000);
}

function boardRect() {
  return board.getBoundingClientRect();
}

function dimensions() {
  const r = boardRect();

  return {
    width: r.width,
    height: r.height,
    pw: r.width / GRID,
    ph: r.height / GRID
  };
}

function targetPosition(piece) {
  const r = boardRect();
  const d = dimensions();

  return {
    x: r.left + (piece.correct % GRID) * d.pw,
    y: r.top + Math.floor(piece.correct / GRID) * d.ph
  };
}

function closeEnough(a,b,distance) {
  return (
    Math.abs(a.x-b.x) < distance &&
    Math.abs(a.y-b.y) < distance
  );
}

/* =========================
   CAMERA PHOTO
========================= */

function capturePhoto() {

  const w = video.videoWidth;
  const h = video.videoHeight;

  if (!w || !h) {
    throw new Error("الكاميرا لم تصبح جاهزة بعد");
  }

  const canvas = document.createElement("canvas");

  canvas.width = 600;
  canvas.height = 600;

  const ctx = canvas.getContext("2d", {
    willReadFrequently: true
  });

  const size = Math.min(w,h);

  const sx = (w-size)/2;
  const sy = (h-size)/2;

  ctx.save();

  ctx.translate(600,0);
  ctx.scale(-1,1);

  ctx.drawImage(
    video,
    sx,sy,size,size,
    0,0,600,600
  );

  ctx.restore();

  // Grayscale filter
  const image = ctx.getImageData(0,0,600,600);
  const data = image.data;

  for(let i=0; i<data.length; i+=4) {

    const gray =
      0.299 * data[i] +
      0.587 * data[i+1] +
      0.114 * data[i+2];

    data[i] = gray;
    data[i+1] = gray;
    data[i+2] = gray;
  }

  ctx.putImageData(image,0,0);

  return canvas.toDataURL("image/jpeg",0.88);
}

/* =========================
   COUNTDOWN
========================= */

function startCountdown() {

  if (!ready) {
    toast("انتظري حتى تعمل الكاميرا");
    return;
  }

  if (countdownRunning) return;

  countdownRunning = true;

  piecesLayer.innerHTML = "";
  pieces = [];

  photo = null;
  solved = false;

  saveBtn.disabled = true;

  board.classList.remove("done");

  let number = 3;

  countEl.style.display = "grid";
  countEl.textContent = number;

  say("استعدي للتصوير...");

  const timer = setInterval(() => {

    number--;

    if (number > 0) {

      countEl.textContent = number;
      say("استعدي... " + number);

    } else {

      clearInterval(timer);

      countEl.style.display = "none";
      countdownRunning = false;

      try {

        photo = capturePhoto();

        buildPuzzle();

        say("المسي الإبهام بالسبابة واسحبي القطع");

      } catch(error) {

        say(error.message);
        toast(error.message);
      }
    }

  },850);
}

/* =========================
   BUILD PUZZLE
========================= */

function buildPuzzle() {

  piecesLayer.innerHTML = "";
  pieces = [];

  const r = boardRect();
  const d = dimensions();

  let order = Array.from(
    {length:TOTAL},
    (_,i)=>i
  );

  // Shuffle
  do {

    for(let i=order.length-1; i>0; i--) {

      const j = Math.floor(Math.random()*(i+1));

      [order[i],order[j]] =
      [order[j],order[i]];
    }

  } while(order.every((v,i)=>v===i));

  order.forEach((correct,slot) => {

    const col = slot % GRID;
    const row = Math.floor(slot / GRID);

    const el = document.createElement("div");

    el.className = "piece";

    el.style.width = d.pw + "px";
    el.style.height = d.ph + "px";

    el.style.left =
      (r.left + col*d.pw) + "px";

    el.style.top =
      (r.top + row*d.ph) + "px";

    el.style.backgroundImage =
      `url("${photo}")`;

    el.style.backgroundSize =
      `${r.width}px ${r.height}px`;

    const correctCol = correct % GRID;
    const correctRow = Math.floor(correct/GRID);

    el.style.backgroundPosition =
      `${-correctCol*d.pw}px ${-correctRow*d.ph}px`;

    const piece = {
      el,
      correct,
      x:r.left + col*d.pw,
      y:r.top + row*d.ph,
      w:d.pw,
      h:d.ph
    };

    // Touch and mouse control
    el.addEventListener(
      "pointerdown",
      e => pointerStart(e,piece)
    );

    piecesLayer.appendChild(el);

    pieces.push(piece);
  });

  updateProgress();
}

/* =========================
   DRAG ENGINE
========================= */

function placePiece(piece,x,y) {

  piece.x = x;
  piece.y = y;

  piece.el.style.left = x + "px";
  piece.el.style.top = y + "px";
}

function snapPiece(piece) {

  const target = targetPosition(piece);

  const distance = Math.min(34,piece.w*0.22);

  if(closeEnough(piece,target,distance)) {

    placePiece(piece,target.x,target.y);

    piece.el.classList.add("correct");

    return true;
  }

  piece.el.classList.remove("correct");

  return false;
}

function beginDrag(piece,x,y) {

  if(!piece || piece.el.classList.contains("correct")) {
    return;
  }

  if(dragged && dragged !== piece) {
    return;
  }

  dragged = piece;

  const rect = piece.el.getBoundingClientRect();

  dragOffset = {
    x:x-rect.left,
    y:y-rect.top
  };

  piece.el.classList.add("drag");
}

function moveDrag(x,y) {

  if(!dragged) return;

  placePiece(
    dragged,
    x-dragOffset.x,
    y-dragOffset.y
  );
}

function endDrag() {

  if(!dragged) return;

  const piece = dragged;

  piece.el.classList.remove("drag");

  snapPiece(piece);

  dragged = null;

  updateProgress();
}

function findPiece(x,y) {

  for(let i=pieces.length-1;i>=0;i--) {

    const p = pieces[i];

    if(p.el.classList.contains("correct")) {
      continue;
    }

    const r = p.el.getBoundingClientRect();

    if(
      x>=r.left &&
      x<=r.right &&
      y>=r.top &&
      y<=r.bottom
    ) {
      return p;
    }
  }

  return null;
}

/* =========================
   POINTER CONTROL
========================= */

function pointerStart(e,piece) {

  if(!photo || dragged || pointerDragId !== null) {
    return;
  }

  if(piece.el.classList.contains("correct")) {
    return;
  }

  e.preventDefault();

  pointerDragId = e.pointerId;

  handEnabled = false;

  beginDrag(piece,e.clientX,e.clientY);

  try {
    piece.el.setPointerCapture(e.pointerId);
  } catch(e) {}
}

window.addEventListener("pointermove",e=> {

  if(pointerDragId !== e.pointerId) return;

  moveDrag(e.clientX,e.clientY);

});

function finishPointer(e) {

  if(pointerDragId !== e.pointerId) return;

  pointerDragId = null;

  endDrag();

  handEnabled = true;
}

window.addEventListener("pointerup",finishPointer);
window.addEventListener("pointercancel",finishPointer);

/* =========================
   HAND TRACKING
========================= */

function onHandResults(results) {

  const landmarks =
    results.multiHandLandmarks?.[0];

  if(!landmarks) {

    dot.style.display = "none";

    if(pinching && dragged && handEnabled) {
      endDrag();
    }

    pinching = false;

    return;
  }

  const thumb = landmarks[4];
  const index = landmarks[8];

  const distance = Math.hypot(
    thumb.x-index.x,
    thumb.y-index.y
  );

  const pinch = distance < 0.052;

  const x =
    (1-(thumb.x+index.x)/2)*innerWidth;

  const y =
    ((thumb.y+index.y)/2)*innerHeight;

  dot.style.display = "block";
  dot.style.left = x + "px";
  dot.style.top = y + "px";

  dot.classList.toggle("pinching",pinch);

  if(!photo || !handEnabled) {
    pinching = pinch;
    return;
  }

  // Start dragging
  if(pinch && !pinching && !dragged) {

    const piece = findPiece(x,y);

    if(piece) {
      beginDrag(piece,x,y);
    }
  }

  // Move
  if(pinch && dragged) {
    moveDrag(x,y);
  }

  // Release
  if(!pinch && pinching && dragged) {
    endDrag();
  }

  pinching = pinch;
}

/* =========================
   PROGRESS & WIN
========================= */

function updateProgress() {

  const correct = pieces.filter(
    p=>p.el.classList.contains("correct")
  ).length;

  progress.textContent =
    `${correct} / ${TOTAL}`;

  if(correct === TOTAL && !solved) {

    solved = true;

    board.classList.add("done");

    say("ممتاز! اكتملت الصورة 🎉");

    saveBtn.disabled = false;

    celebrate();
  }
}

/* =========================
   CELEBRATION
========================= */

function celebrate() {

  const colors = [
    "#ff2d95",
    "#ffd700",
    "#00ff99",
    "#00e5ff",
    "#ffffff"
  ];

  for(let i=0;i<90;i++) {

    const el = document.createElement("div");

    el.className = "confetti";

    el.style.left = "50%";
    el.style.top = "45%";

    el.style.background =
      colors[i%colors.length];

    document.body.appendChild(el);

    const angle = Math.random()*Math.PI*2;
    const distance = 100+Math.random()*250;

    const animation = el.animate(
      [
        {
          transform:"translate(0,0) rotate(0)",
          opacity:1
        },
        {
          transform:
            `translate(${Math.cos(angle)*distance}px,
            ${Math.sin(angle)*distance+180}px)
            rotate(720deg)`,
          opacity:0
        }
      ],
      {
        duration:1300+Math.random()*700,
        easing:"cubic-bezier(.2,.8,.3,1)"
      }
    );

    animation.onfinish = ()=>el.remove();
  }

  if(navigator.vibrate) {
    navigator.vibrate([100,50,100]);
  }
}

/* =========================
   SAVE FINAL PHOTO
========================= */

function saveImage() {

  if(!solved || !photo) {
    toast("أكملي البازل أولاً");
    return;
  }

  const img = new Image();

  img.onload = ()=> {

    const canvas = document.createElement("canvas");

    canvas.width = 900;
    canvas.height = 900;

    const ctx = canvas.getContext("2d");

    ctx.drawImage(img,0,0,900,900);

    canvas.toBlob(blob=> {

      if(!blob) {
        toast("تعذر تجهيز الصورة");
        return;
      }

      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");

      a.href = url;
      a.download = "EMAN-PUZZLE.png";

      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(()=>URL.revokeObjectURL(url),3000);

      toast("تم حفظ الصورة");

    },"image/png");
  };

  img.onerror = ()=> {
    toast("تعذر تحميل الصورة");
  };

  img.src = photo;
}

/* =========================
   RESET
========================= */

function resetGame() {

  if(dragged) {
    dragged.el.classList.remove("drag");
    dragged = null;
  }

  piecesLayer.innerHTML = "";

  pieces = [];
  photo = null;
  solved = false;
  pinching = false;

  saveBtn.disabled = true;

  progress.textContent = "0 / 9";

  board.classList.remove("done");

  countEl.style.display = "none";

  say("اضغطي ابدأ وارفعي يدك أمام الكاميرا ✋");
}

/* =========================
   CAMERA & MEDIAPIPE
========================= */

async function initializeCamera() {

  try {

    if(!navigator.mediaDevices ||
       !navigator.mediaDevices.getUserMedia) {

      throw new Error(
        "يجب فتح الصفحة عبر HTTPS أو localhost لتشغيل الكاميرا"
      );
    }

    if(typeof Hands === "undefined") {
      throw new Error(
        "تعذر تحميل مكتبة تتبع اليد. تحققي من الإنترنت."
      );
    }

    hands = new Hands({
      locateFile: file =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands:1,
      modelComplexity:0,
      minDetectionConfidence:0.62,
      minTrackingConfidence:0.58
    });

    hands.onResults(onHandResults);

    stream = await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:"user",
        width:{ideal:640},
        height:{ideal:480},
        frameRate:{ideal:24,max:30}
      },

      audio:false
    });

    video.srcObject = stream;

    await new Promise((resolve,reject)=> {

      if(video.readyState >= 2) {
        resolve();
        return;
      }

      video.onloadedmetadata = ()=>resolve();

      video.onerror = ()=>reject(
        new Error("تعذر تشغيل الفيديو")
      );

    });

    await video.play();

    ready = true;

    status.textContent =
      "الكاميرا جاهزة · ارفعي يدك للتحكم";

    say("اضغطي ابدأ وارفعي يدك أمام الكاميرا ✋");

    // Process only one frame at a time
    async function processFrame(now) {

      if(!ready) return;

      if(
        !processing &&
        now-lastSend > 65 &&
        video.readyState >= 2
      ) {

        processing = true;

        lastSend = now;

        try {

          await hands.send({
            image:video
          });

        } catch(error) {

          console.warn("Hand tracking:",error);

        } finally {

          processing = false;
        }
      }

      rafId = requestAnimationFrame(processFrame);
    }

    rafId = requestAnimationFrame(processFrame);

  } catch(error) {

    console.error(error);

    ready = false;

    status.textContent = "تعذر تشغيل الكاميرا";

    say(error.message || "تحققي من إذن الكاميرا");

    toast("تحققي من إذن الكاميرا والإنترنت");
  }
}

/* =========================
   EVENTS
========================= */

startBtn.addEventListener(
  "click",
  startCountdown
);

saveBtn.addEventListener(
  "click",
  saveImage
);

$("reset").addEventListener(
  "click",
  resetGame
);

/* =========================
   CLEANUP
========================= */

window.addEventListener("pagehide",()=> {

  ready = false;

  if(rafId) {
    cancelAnimationFrame(rafId);
  }

  if(stream) {
    stream.getTracks().forEach(
      track=>track.stop()
    );
  }

  if(hands && hands.close) {
    hands.close();
  }
});

/* =========================
   START
========================= */
